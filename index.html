<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ Trích xuất Tên File Hàng loạt</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 650px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--primary-color);
            text-align: center;
        }

        .upload-area {
            border: 2px dashed var(--primary-color);
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            background-color: #f5f3ff;
            transition: all 0.3s ease;
        }

        .upload-area:hover, .upload-area.dragover {
            background-color: #ede9fe;
            border-color: var(--primary-hover);
        }

        .upload-icon {
            font-size: 40px;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .upload-text {
            font-size: 16px;
            font-weight: 500;
        }

        #fileInput {
            display: none;
        }

        .options-group {
            margin: 20px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            font-size: 14px;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option-item input[type="checkbox"], 
        .option-item select {
            cursor: pointer;
        }

        .option-item select {
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            outline: none;
        }

        .result-container {
            margin-top: 20px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .file-count {
            color: var(--primary-color);
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 12px;
            box-sizing: border-box;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
            outline: none;
            background-color: #fafafa;
        }

        textarea:focus {
            border-color: var(--primary-color);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: #475569;
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        .toast {
            visibility: hidden;
            min-width: 200px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 12px;
            position: fixed;
            z-index: 1;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
        }

        .toast.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Trích xuất Tên File Hàng loạt</h2>

    <!-- Vùng kéo thả / chọn file -->
    <div class="upload-area" id="dropArea">
        <div class="upload-icon">📂</div>
        <div class="upload-text">Kéo thả file vào đây hoặc nhấp để chọn file</div>
        <p style="margin: 5px 0 0 0; font-size: 12px; color: #64748b;">(Hỗ trợ chọn nhiều file cùng lúc)</p>
        <input type="file" id="fileInput" multiple>
    </div>

    <!-- Tùy chọn -->
    <div class="options-group">
        <div class="option-item">
            <input type="checkbox" id="removeExtension">
            <label for="removeExtension">Loại bỏ đuôi file (extension)</label>
        </div>
        <div class="option-item">
            <label for="separator">Ngăn cách bằng:</label>
            <select id="separator">
                <option value="newline">Xuống dòng</option>
                <option value="comma">Dấu phẩy ( , )</option>
                <option value="semicolon">Dấu chấm phẩy ( ; )</option>
                <option value="space">Khoảng trắng</option>
            </select>
        </div>
    </div>

    <!-- Kết quả -->
    <div class="result-container">
        <div class="result-header">
            <span>Danh sách tên file (<span id="fileCount" class="file-count">0</span> file)</span>
        </div>
        <textarea id="resultArea" placeholder="Tên các file đã trích xuất sẽ hiển thị ở đây..." readonly></textarea>
    </div>

    <!-- Nút chức năng -->
    <div class="button-group">
        <button class="btn btn-primary" id="copyBtn">Sao chép kết quả</button>
        <button class="btn btn-secondary" id="clearBtn">Xóa danh sách</button>
    </div>
</div>

<div id="toast" class="toast">Đã sao chép vào bộ nhớ tạm!</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const dropArea = document.getElementById('dropArea');
    const resultArea = document.getElementById('resultArea');
    const fileCount = document.getElementById('fileCount');
    const removeExtension = document.getElementById('removeExtension');
    const separatorSelect = document.getElementById('separator');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');
    const toast = document.getElementById('toast');

    let currentFiles = [];

    // Kích hoạt input file khi click vào vùng upload
    dropArea.addEventListener('click', () => fileInput.click());

    // Xử lý kéo thả file
    ['dragenter', 'dragover'].forEach(eventName => {
        dropArea.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropArea.classList.add('dragover');
        }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropArea.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropArea.classList.remove('dragover');
        }, false);
    });

    dropArea.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;
        if (files.length > 0) {
            currentFiles = Array.from(files);
            processFiles();
        }
    });

    // Khi người dùng chọn file thông qua hộp thoại hệ thống
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            currentFiles = Array.from(e.target.files);
            processFiles();
        }
    });

    // Xử lý cập nhật kết quả khi thay đổi các tùy chọn cấu hình
    removeExtension.addEventListener('change', processFiles);
    separatorSelect.addEventListener('change', processFiles);

    // Hàm chính để xử lý và hiển thị tên file
    function processFiles() {
        if (currentFiles.length === 0) {
            resultArea.value = '';
            fileCount.textContent = '0';
            return;
        }

        let fileNames = currentFiles.map(file => {
            let name = file.name;
            if (removeExtension.checked) {
                // Biểu thức chính quy cắt bỏ phần mở rộng cuối cùng của file
                name = name.substring(0, name.lastIndexOf('.')) || name;
            }
            return name;
        });

        // Thiết lập ký tự phân tách
        let separator = '\n';
        switch (separatorSelect.value) {
            case 'comma':
                separator = ', ';
                break;
            case 'semicolon':
                separator = '; ';
                break;
            case 'space':
                separator = ' ';
                break;
            default:
                separator = '\n';
        }

        resultArea.value = fileNames.join(separator);
        fileCount.textContent = currentFiles.length;
    }

    // Sao chép nội dung vào bộ nhớ tạm (Clipboard)
    copyBtn.addEventListener('click', () => {
        if (!resultArea.value) {
            showToast('Không có dữ liệu để sao chép!');
            return;
        }

        navigator.clipboard.writeText(resultArea.value)
            .then(() => {
                showToast('Đã sao chép danh sách tên file!');
            })
            .catch(err => {
                // Dự phòng cho trình duyệt cũ hơn không hỗ trợ navigator.clipboard
                resultArea.select();
                document.execCommand('copy');
                showToast('Đã sao chép danh sách tên file!');
            });
    });

    // Xóa sạch dữ liệu đã chọn
    clearBtn.addEventListener('click', () => {
        currentFiles = [];
        fileInput.value = '';
        processFiles();
        showToast('Đã xóa dữ liệu.');
    });

    // Hiển thị thông báo Toast nhanh
    function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 2000);
    }
</script>

</body>
</html>
