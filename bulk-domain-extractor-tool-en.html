<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Domain Extractor Tool</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }
        p.description {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #34495e;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
        }
        .options {
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
        }
        .options label {
            font-weight: normal;
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .options input {
            margin-right: 8px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .output-group {
            margin-top: 25px;
        }
        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .btn-copy {
            background-color: #2ecc71;
            padding: 6px 12px;
            font-size: 12px;
            width: auto;
        }
        .btn-copy:hover {
            background-color: #27ae60;
        }
        .counter {
            font-size: 14px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Bulk Domain Extractor Tool</h2>
    <p class="description">Paste text containing links or a list of URLs below to extract a clean list of domains.</p>

    <div class="form-group">
        <label for="inputText">Input Text:</label>
        <textarea id="inputText" placeholder="Example: paste text containing links like https://voviethoang.com/en/tool/bulk-domain-extractor-tool here..."></textarea>
    </div>

    <div class="options">
        <label>
            <input type="checkbox" id="removeWww" checked> Remove "www."
        </label>
        <label>
            <input type="checkbox" id="keepUnique" checked> Remove duplicates (Unique)
        </label>
    </div>

    <button onclick="extractDomains()">Extract Domains</button>

    <div class="output-group">
        <div class="output-header">
            <label for="outputText">Extracted Results:</label>
            <span class="counter" id="domainCount">Found: 0 domains</span>
        </div>
        <textarea id="outputText" readonly placeholder="Results will appear here..."></textarea>
        <button class="btn-copy" onclick="copyToClipboard()" style="margin-top: 10px;">Copy Results</button>
    </div>
</div>

<script>
function extractDomains() {
    const inputText = document.getElementById('inputText').value;
    const removeWww = document.getElementById('removeWww').checked;
    const keepUnique = document.getElementById('keepUnique').checked;

    // Regular expression to match URLs and domain structures within text
    const domainRegex = /\b(?:https?:\/\/)?(?:www\.)?([a-zA-Z0-9][-a-zA-Z0-9]{0,62}\.)+([a-zA-Z]{2,18})\b/gi;
    
    let matches;
    let domains = [];

    // Loop through all regex matches
    while ((matches = domainRegex.exec(inputText)) !== null) {
        let fullMatch = matches[0].toLowerCase();
        
        try {
            // Prepend http:// if missing to leverage Browser's URL API
            if (!/^https?:\/\//i.test(fullMatch)) {
                fullMatch = 'http://' + fullMatch;
            }
            const urlObj = new URL(fullMatch);
            let hostname = urlObj.hostname;

            // Option to strip www.
            if (removeWww && hostname.startsWith('www.')) {
                hostname = hostname.substring(4);
            }

            domains.push(hostname);
        } catch (e) {
            // Ignore if string fails URL parsing
        }
    }

    // Deduplicate if checked
    if (keepUnique) {
        domains = [...new Set(domains)];
    }

    // Display output
    document.getElementById('outputText').value = domains.join('\n');
    document.getElementById('domainCount').textContent = `Found: ${domains.length} domains`;
}

function copyToClipboard() {
    const outputText = document.getElementById('outputText');
    if (!outputText.value) {
        alert('No data to copy!');
        return;
    }
    outputText.select();
    outputText.setSelectionRange(0, 99999); // Mobile device support

    navigator.clipboard.writeText(outputText.value)
        .then(() => {
            alert('Copied to clipboard!');
        })
        .catch(err => {
            alert('Failed to copy: ' + err);
        });
}
</script>

</body>
</html>
