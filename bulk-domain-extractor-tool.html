<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ Trích xuất Tên miền</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }
        p.description {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #34495e;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
        }
        .options {
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
        }
        .options label {
            font-weight: normal;
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .options input {
            margin-right: 8px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .output-group {
            margin-top: 25px;
        }
        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .btn-copy {
            background-color: #2ecc71;
            padding: 6px 12px;
            font-size: 12px;
            width: auto;
        }
        .btn-copy:hover {
            background-color: #27ae60;
        }
        .counter {
            font-size: 14px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Công cụ Trích xuất Tên miền</h2>
    <p class="description">Nhập văn bản chứa liên kết hoặc danh sách URL vào ô bên dưới để trích xuất danh sách tên miền duy nhất.</p>

    <div class="form-group">
        <label for="inputText">Văn bản đầu vào:</label>
        <textarea id="inputText" placeholder="Ví dụ: dán một đoạn văn bản chứa link https://google.com hoặc facebook.com/profile vào đây..."></textarea>
    </div>

    <div class="options">
        <label>
            <input type="checkbox" id="removeWww" checked> Loại bỏ "www."
        </label>
        <label>
            <input type="checkbox" id="keepUnique" checked> Loại bỏ trùng lặp (Unique)
        </label>
    </div>

    <button onclick="extractDomains()">Trích xuất Tên miền</button>

    <div class="output-group">
        <div class="output-header">
            <label for="outputText">Kết quả trích xuất:</label>
            <span class="counter" id="domainCount">Tìm thấy: 0 tên miền</span>
        </div>
        <textarea id="outputText" readonly placeholder="Kết quả sẽ hiển thị ở đây..."></textarea>
        <button class="btn-copy" onclick="copyToClipboard()" style="margin-top: 10px;">Sao chép kết quả</button>
    </div>
</div>

<script>
function extractDomains() {
    const inputText = document.getElementById('inputText').value;
    const removeWww = document.getElementById('removeWww').checked;
    const keepUnique = document.getElementById('keepUnique').checked;

    // Biểu thức chính quy hỗ trợ tìm kiếm cấu trúc giống tên miền hoặc URL trong văn bản
    const domainRegex = /\b(?:https?:\/\/)?(?:www\.)?([a-zA-Z0-9][-a-zA-Z0-9]{0,62}\.)+([a-zA-Z]{2,18})\b/gi;
    
    let matches;
    let domains = [];

    // Chạy regex để tìm tất cả các chuỗi khớp
    while ((matches = domainRegex.exec(inputText)) !== null) {
        let fullMatch = matches[0].toLowerCase();
        
        try {
            // Chuẩn hóa chuỗi bằng cách thêm http:// nếu chưa có để tận dụng thư viện URL của trình duyệt
            if (!/^https?:\/\//i.test(fullMatch)) {
                fullMatch = 'http://' + fullMatch;
            }
            const urlObj = new URL(fullMatch);
            let hostname = urlObj.hostname;

            // Xử lý tùy chọn loại bỏ www.
            if (removeWww && hostname.startsWith('www.')) {
                hostname = hostname.substring(4);
            }

            domains.push(hostname);
        } catch (e) {
            // Bỏ qua nếu không parse được thành URL hợp lệ
        }
    }

    // Xử lý loại bỏ trùng lặp nếu được kích hoạt
    if (keepUnique) {
        domains = [...new Set(domains)];
    }

    // Hiển thị kết quả
    document.getElementById('outputText').value = domains.join('\n');
    document.getElementById('domainCount').textContent = `Tìm thấy: ${domains.length} tên miền`;
}

function copyToClipboard() {
    const outputText = document.getElementById('outputText');
    if (!outputText.value) {
        alert('Không có dữ liệu để sao chép!');
        return;
    }
    outputText.select();
    outputText.setSelectionRange(0, 99999); // Dành cho thiết bị di động

    navigator.clipboard.writeText(outputText.value)
        .then(() => {
            alert('Đã sao chép vào bộ nhớ tạm!');
        })
        .catch(err => {
            alert('Lỗi khi sao chép: ' + err);
        });
}
</script>

</body>
</html>
